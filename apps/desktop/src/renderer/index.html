<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; media-src 'self' blob:; worker-src 'self' blob:">
  <title>Conversationer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="who"><strong id="partner-name">Conversationer</strong> <span id="partner-line"></span></div>
    <div class="header-actions">
      <label id="level-label" hidden>My <span id="level-language"></span>
        <select id="level"></select>
      </label>
      <button id="change-partner" class="quiet" hidden>Change partner</button>
    </div>
  </header>
  <section id="choose" class="panel" hidden>
    <h1>Who would you like to talk to?</h1>
    <p class="muted">You can switch at any time. Each partner is an AI, not a real person.</p>
    <div id="partner-list" class="partner-list"></div>
  </section>
  <section id="setup" class="panel" hidden>
    <h1 id="setup-title">Before you start</h1>
    <p id="setup-text"></p>
    <p id="setup-note" class="muted"></p>
    <progress id="setup-progress" max="1" value="0" hidden></progress>
    <p id="setup-status" class="muted" role="status"></p>
    <p id="setup-detail" class="small" hidden></p>
    <button id="setup-accept" class="primary">Start download</button>
    <p class="small">Voices: Kyutai Pocket TTS (CC BY 4.0). Language model: Google Gemma 4 (Apache 2.0).</p>
  </section>
  <main id="conversation" aria-live="polite"></main>
  <footer>
    <p id="notice" role="status"></p>
    <div class="turn">
      <div id="ring" class="ring" aria-hidden="true"></div>
      <p id="status">Getting ready…</p>
      <button id="replay" class="quiet" hidden>▶ Hear again</button>
      <button id="action" class="primary" disabled>Start speaking</button>
    </div>
    <form id="typing"><input id="text" autocomplete="off" placeholder="Or type here…" aria-label="Type your turn"><button type="submit">Send</button></form>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
